<div style="padding: 8px 0">

  <div style="margin-bottom: 12px; text-align: center">
    <strong style="color: #ff6633; font-size: 14px; letter-spacing: 1px">VARDORVIS TRAINER</strong>
  </div>

  <!-- Mode -->
  <div style="margin-bottom: 8px">
    <input type="checkbox" id="vard-awakened-toggle" name="vard-awakened-toggle" checked />
    <label for="vard-awakened-toggle">Awakened Mode (1400 HP)</label>
  </div>

  <!-- Controls -->
  <button id="vard-pause">Pause / Resume</button>

  <hr style="margin: 10px 0; border-color: #333" />

  <!-- Display settings -->
  <div style="margin-bottom: 6px; font-weight: bold; font-size: 11px; color: #aaa">DISPLAY</div>

  <div style="margin-bottom: 5px">
    <input type="checkbox" id="vard-safe-tiles" name="vard-safe-tiles" checked />
    <label for="vard-safe-tiles">Safe tile highlights</label>
  </div>

  <hr style="margin: 10px 0; border-color: #333" />

  <!-- Mechanics -->
  <div style="margin-bottom: 6px; font-weight: bold; font-size: 11px; color: #aaa">MECHANICS</div>

  <div style="margin-bottom: 5px">
    <input type="checkbox" id="vard-force-enrage" name="vard-force-enrage" />
    <label for="vard-force-enrage">Force enrage phase</label>
  </div>
  <div style="margin-bottom: 5px">
    <input type="checkbox" id="vard-head" name="vard-head" checked />
    <label for="vard-head">Head attacks</label>
  </div>
  <div style="margin-bottom: 5px">
    <input type="checkbox" id="vard-strangle" name="vard-strangle" checked />
    <label for="vard-strangle">Strangle mechanic</label>
  </div>
  <div style="margin-bottom: 5px">
    <input type="checkbox" id="vard-spikes" name="vard-spikes" checked />
    <label for="vard-spikes">Darting spikes</label>
  </div>
  <div style="margin-bottom: 5px">
    <input type="checkbox" id="vard-auto-atk" name="vard-auto-atk" checked />
    <label for="vard-auto-atk">Auto-attack damage</label>
  </div>

  <hr style="margin: 10px 0; border-color: #333" />

  <!-- Info -->
  <div style="font-size: 11px; color: #888; line-height: 1.5">
    <div><strong style="color: #ccc">Axes:</strong> 3 axes until 50% HP, then 4</div>
    <div><strong style="color: #ccc">Head:</strong> Below 81% HP. Green = Missiles, Blue = Magic</div>
    <div><strong style="color: #ccc">Strangle:</strong> Below 80% HP — click spores fast!</div>
    <div><strong style="color: #ccc">Enrage:</strong> At 33% HP — axes/head frequency doubles</div>
  </div>

  <hr style="margin: 10px 0; border-color: #333" />

  <a href="https://oldschool.runescape.wiki/w/Vardorvis" target="_blank">Wiki: Vardorvis</a>
  <a href="https://oldschool.runescape.wiki/w/Vardorvis/Strategies" target="_blank">Strategy Guide</a>

</div>
